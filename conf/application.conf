# This is the main configuration file for the application.
# ~~~~~

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
# If you deploy your application to several instances be sure to use the same key!
play.http.secret.key = ${?APPLICATION_SECRET}

# Allowed hosts
# ~~~~~
play.filters.hosts.allowed = ["demo.kevinlee.io", "localhost"]

# Filters
# ~~~~~
play.filters.enabled += filters.TrailingSlashFilter

# Session
# ~~~~~
# Browsers send the session cookie only over HTTPS.
play.http.session.secure = true

# The application languages
# ~~~~~
play.i18n.langs=["en"]

# Logger
# ~~~~~
# Logging is configured with logback (https://logback.qos.ch/) in conf/logback.xml.
